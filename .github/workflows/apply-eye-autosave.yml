name: Apply Eye Tracking autosave update

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply notebook update
        run: python tools/patch_eye_tracking_autosave.py

      - name: Commit notebook if changed
        run: |
          if git diff --quiet -- 01_EyeTracking.ipynb; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_EyeTracking.ipynb
          git commit -m "Enable automatic PNG evidence in Eye Tracking"
          git push
